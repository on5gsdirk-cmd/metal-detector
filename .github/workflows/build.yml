name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Unit tests (core + firmware-protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Firmware-protocoltests (host, g++)
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/spirit_pi_v3 firmware/test/test_protocol.cpp -o /tmp/test_protocol
          /tmp/test_protocol
      - name: Core-tests (Kotlin)
        run: ./gradlew :core:test --no-daemon

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Versienaam
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "APP_VERSION=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi
      - name: Debug-APK bouwen
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Lint (niet blokkerend)
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Hernoemen
        run: cp app/build/outputs/apk/debug/app-debug.apk "PIDetector-ON5GS-${APP_VERSION}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PIDetector-debug-apk
          path: PIDetector-ON5GS-*-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
      - name: Release-APK bouwen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "PIDetector-ON5GS-${APP_VERSION}.apk"
      - name: GitHub-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PIDetector-ON5GS-${{ env.APP_VERSION }}.apk
          generate_release_notes: true

  firmware:
    name: Firmware (esp32 core ${{ matrix.core }})
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        core: ["2.0.17", "3.0.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32-core installeren
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core }}
      - name: Compileren voor DOIT ESP32 DevKit V1
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 --warnings default \
            --output-dir build firmware/spirit_pi_v3
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-core-${{ matrix.core }}
          path: build/*.bin
